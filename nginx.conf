# nginx 主配置（web 容器内 /etc/nginx/nginx.conf）
# 职责：托管前端静态产物 + SPA history fallback + /api/v1 同源反代到 api:3000

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;

  # 笔记为 Markdown 文本，留足请求体空间（默认 1m 偏紧）
  client_max_body_size 10m;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   5;
  gzip_types        text/plain text/css text/markdown application/javascript
                    application/json application/xml image/svg+xml;

  server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 容器内健康检查（不经过后端）
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # API 同源反代：/api/v1/... 原样转发到 api:3000/api/v1/...
    # 用变量 + Docker 内置 DNS（127.0.0.11）解析，避免 api 未就绪时 nginx 启动失败，
    # 也让 api 容器重启换 IP 后自动重新解析。
    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream "api:3000";
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
      # 后端错误响应原样返回（契约错误信封不能被打断）
      proxy_intercept_errors off;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA history 路由回退（/projects/:id、/admin/* 直接刷新也能命中）
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
