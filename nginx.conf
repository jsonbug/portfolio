# nginx 主配置（web 容器内 /etc/nginx/nginx.conf）
# 职责：托管前端静态产物 + SPA history fallback + /api/v1 同源反代到 api:3000

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;

  # 笔记为 Markdown 文本，留足请求体空间（默认 1m 偏紧）
  client_max_body_size 10m;

  # 登录边缘限流：单管理员登录，防的是公网暴力破解，所以在边缘挡，后端不记账、契约不加字段。
  # rate=5r/m ≈ 每 12 秒回填 1 个令牌；burst 是「允许的额外突发量」，可放行总数 = burst + 1
  # （首请求走 rate，其后每个突发占 1 格）——实测 burst=5 时第 7 次才 429，故取 4，
  # 语义即「一分钟内连错 5 次，第 6 次挡住」。
  limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
  limit_req_status 429;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   5;
  gzip_types        text/plain text/css text/markdown application/javascript
                    application/json application/xml image/svg+xml;

  server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 容器内健康检查（不经过后端）
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # 登录限流：只挂在这一个精确匹配上（= 表示精确，不带 /api/v1/ 前缀，
    # 不影响笔记/项目等其它 API，也不影响静态资源与 SPA 回退）。
    # 精确匹配优先级高于任何前缀匹配，与下面 location /api/ 的书写顺序无关。
    # 注意：下面那段 proxy_* 与 `location /api/` 里的**逐行一致**（同步改，别只改一处）；
    # 没有抽成 snippet 是本仓只需要这两处，多一个被 COPY 的文件比多 12 行更难追。
    location = /api/v1/auth/login {
      limit_req zone=login_zone burst=4 nodelay;
      limit_req_status 429;
      limit_req_log_level warn;
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream "api:3000";
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
      proxy_intercept_errors off;
    }

    # API 同源反代：/api/v1/... 原样转发到 api:3000/api/v1/...
    # 用变量 + Docker 内置 DNS（127.0.0.11）解析，避免 api 未就绪时 nginx 启动失败，
    # 也让 api 容器重启换 IP 后自动重新解析。
    location /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $api_upstream "api:3000";
      proxy_pass         http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
      # 后端错误响应原样返回（契约错误信封不能被打断）
      proxy_intercept_errors off;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA history 路由回退（/projects/:id、/admin/* 直接刷新也能命中）
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
