name: CI

on:
  push:
    # 实际开发在 integration/* 与 feat/* 上进行，只看 main 会让 CI 在真正写代码的分支上不跑
    branches: [main, 'integration/**', 'feat/**']
  pull_request:

jobs:
  frontend:
    name: Frontend · lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend · validate / typecheck / lint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema 校验
        run: npx prisma validate

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 测试
        run: npm test

  contract:
    name: Contract · 协议同构（real vs mock，独立 SQLite）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 与 compose job 职责不同、互不替代：这里只验协议本身，不起容器、不走反代。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 装后端依赖 + 建独立库
        working-directory: backend
        env:
          DATABASE_URL: file:./ci-contract.db
        run: |
          set -euo pipefail
          npm ci
          npx prisma migrate deploy
          npx prisma generate

      - name: 起后端（独立端口 4399，避开开发机与其它 job）
        working-directory: backend
        env:
          DATABASE_URL: file:./ci-contract.db
          PORT: '4399'
          HOST: 127.0.0.1
          NODE_ENV: test
          LINK_CHECK_ENABLED: '0'
          AUTH_SECRET: ci-contract-secret-not-for-production
          ADMIN_USERNAME: admin
        run: |
          set -euo pipefail
          # 口令摘要必须在同一个 shell 里 export：写 GITHUB_ENV 只对后续 step 生效，本 step 读不到
          export ADMIN_PASSWORD_HASH="$(node scripts/hash-password.mjs 'ci-contract-Passw0rd')"
          nohup npx tsx src/index.ts > /tmp/contract-backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4399/api/v1/health >/dev/null 2>&1; then echo "api ready after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo '::error::契约 job 的后端未在 90s 内就绪'
          tail -100 /tmp/contract-backend.log
          exit 1

      - name: 装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 双向契约（任何一行不一致即红）
        working-directory: frontend
        env:
          CONTRACT_BASE_URL: http://127.0.0.1:4399/api/v1
          CONTRACT_ADMIN_USERNAME: admin
          CONTRACT_ADMIN_PASSWORD: ci-contract-Passw0rd
        run: npm run contract -- --source both

      - name: 失败时导出后端日志
        if: failure()
        run: tail -200 /tmp/contract-backend.log || true

  compose:
    name: Docker · compose 构建 + 一键起 + 全链路冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成 .env（随机密钥 + 临时口令摘要）
        run: |
          set -euo pipefail
          cp .env.example .env
          SECRET=$(openssl rand -base64 48 | tr -d '\n')
          HASH=$(node backend/scripts/hash-password.mjs 'ci-smoke-Passw0rd')
          python3 - "$SECRET" "$HASH" <<'PY'
          import sys, pathlib
          secret, hash_ = sys.argv[1], sys.argv[2]
          p = pathlib.Path('.env')
          out = []
          for line in p.read_text().splitlines():
              if line.startswith('AUTH_SECRET='):
                  line = f'AUTH_SECRET={secret}'
              elif line.startswith('ADMIN_PASSWORD_HASH='):
                  line = f'ADMIN_PASSWORD_HASH={hash_}'
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          PY

      - name: 检查 compose 版本（< 2.30 直接红，不假绿）
        run: |
          set -euo pipefail
          docker version --format 'server {{.Server.Version}}'
          ver=$(docker compose version --short 2>/dev/null || docker compose version | head -1)
          ver=$(printf '%s' "$ver" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          echo "docker compose $ver"
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 30 ]; }; then
            echo "::error::docker compose $ver < 2.30：env_file 的 format: raw 不支持，冒烟跑不起来。"
            echo "::error::跳过会让这项检查变成假绿（比没有检查更危险），因此直接判失败。升级 runner 上的 compose 或调整该 job。"
            exit 1
          fi

      - name: 构建镜像
        run: docker compose build

      - name: 起服务并等 healthy
        # LINK_CHECK_ENABLED=0：冒烟脚本不该让别人机器上的栈偷偷发外网请求（compose 默认是 1）
        env:
          LINK_CHECK_ENABLED: "0"
        run: |
          set -euo pipefail
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then echo "api ready after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo '::error::api 未在 120s 内就绪'
          docker compose ps
          docker compose logs --no-color --tail 100
          exit 1

      - name: 全链路冒烟
        run: ADMIN_PASSWORD='ci-smoke-Passw0rd' node scripts/smoke-compose.mjs --base http://localhost:8080

      - name: 失败时导出容器日志
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: 收尾
        if: always()
        run: docker compose down -v
